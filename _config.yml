title: "Bruce Li (Bingcheng Li)"
title_zh: "李炳成"
description: "Supply chain operations research, notes, and writing — plus running, photography, and music."
description_zh: "供应链运营研究、笔记与写作，以及长跑、摄影与音乐。"
# 首页头像
profile_image: "/assets/images/profile.jpg"
url: "https://bclee012.github.io" # update
baseurl: "" # keep empty for username.github.io
markdown: kramdown
permalink: pretty

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/
  research:
    output: true
    permalink: /research/:name/
  arts:
    output: true
    permalink: /arts/:name/
  sports:
    output: true
    permalink: /sports/:name/
  thoughts:
    output: true
    permalink: /thoughts/:name/

  # 首页 news 区块：短公告，不单独生成页面
  news:
    output: false

# Defaults for collections
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: post
  - scope:
      path: ""
      type: research
    values:
      layout: post
  - scope:
      path: ""
      type: arts
    values:
      layout: post
  - scope:
      path: ""
      type: sports
    values:
      layout: post
  - scope:
      path: ""
      type: thoughts
    values:
      layout: post

# Include the search index
exclude:
  - node_modules
  - vendor

# Build settings
theme: minima
plugins: []
