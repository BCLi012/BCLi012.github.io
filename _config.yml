title: "Bruce Li (Bingcheng Li)"
title_zh: "李炳成"
description: "Supply chain operations research, notes, and writing — plus running, photography, and music."
description_zh: "供应链运营研究、笔记与写作，以及长跑、摄影与音乐。"
# 首页头像
profile_image: "/assets/images/profile.jpg"
url: "https://bclee012.github.io" # update
baseurl: "" # keep empty for username.github.io
markdown: kramdown
permalink: pretty

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/
  research:
    output: true
    permalink: /research/:name/
  arts:
    output: true
    permalink: /arts/:name/
  sports:
    output: true
    permalink: /sports/:name/
  thoughts:
    output: true
    permalink: /thoughts/:name/

  # 首页 news 区块：短公告，不单独生成页面
  news:
    output: false

# Defaults for collections
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: post
  - scope:
      path: ""
      type: research
    values:
      layout: post
  - scope:
      path: ""
      type: arts
    values:
      layout: post
  - scope:
      path: ""
      type: sports
    values:
      layout: post
  - scope:
      path: ""
      type: thoughts
    values:
      layout: post

# 不发布到线上站点的文件
# 仓库文档（README 等）留在仓库里即可，无需作为静态文件复制进站点；
# 另外 GitHub Pages 的默认插件会让无 front matter 的 Markdown 被发现，
# 显式排除更稳妥。
exclude:
  - README.md
  - MAINTENANCE.md
  - ARCHITECTURE.md
  - node_modules
  - vendor

# 构建设置
# 不使用主题：全站布局都在 _layouts/ 内，所有页面均显式声明 layout。
# 此前保留着 starter 模板遗留的 theme: minima，实际无人引用，
# 却会让无布局的文件被套上外部主题样式，并拖慢构建。
plugins: []
