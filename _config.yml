title: "Bruce"
description: "Personal site — projects, research, arts, and outdoor adventures."
# 首页头像：上传照片后把这里换成你的图片路径即可（例如 /assets/images/profile.jpg）
profile_image: "/assets/images/profile-placeholder.svg"
url: "https://bclee012.github.io" # update
baseurl: "" # keep empty for username.github.io
markdown: kramdown
permalink: pretty

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/
  research:
    output: true
    permalink: /research/:name/
  arts:
    output: true
    permalink: /arts/:name/
  sports:
    output: true
    permalink: /sports/:name/
  thoughts:
    output: true
    permalink: /thoughts/:name/

  # 首页 news 区块：短公告，不单独生成页面
  news:
    output: false

# Defaults for collections
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: post
  - scope:
      path: ""
      type: research
    values:
      layout: post
  - scope:
      path: ""
      type: arts
    values:
      layout: post
  - scope:
      path: ""
      type: sports
    values:
      layout: post
  - scope:
      path: ""
      type: thoughts
    values:
      layout: post

# Include the search index
exclude:
  - node_modules
  - vendor

# Build settings
theme: minima
plugins: []
