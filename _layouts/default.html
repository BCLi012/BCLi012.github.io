<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% if page.title and page.url != '/' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.summary | default: page.excerpt | strip_html | strip_newlines | default: site.description }}" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ page.title | default: site.title }}" />
  <meta property="og:description" content="{{ page.summary | default: site.description }}" />
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}" />
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <script defer src="{{ '/assets/vendor/simple-jekyll-search.min.js' | relative_url }}"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects' %}class="active"{% endif %}>Projects</a>
        <a href="{{ '/research/' | relative_url }}" {% if page.url contains '/research' %}class="active"{% endif %}>Research</a>
        <a href="{{ '/creative/' | relative_url }}" {% if page.url contains '/creative' %}class="active"{% endif %}>Creative</a>
        <a href="{{ '/sports/' | relative_url }}" {% if page.url contains '/sports' %}class="active"{% endif %}>Sports</a>
        <a href="{{ '/thoughts/' | relative_url }}" {% if page.url contains '/thoughts' %}class="active"{% endif %}>Thoughts</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}class="active"{% endif %}>About</a>
        <a href="{{ '/contact/' | relative_url }}" {% if page.url contains '/contact' %}class="active"{% endif %}>Contact</a>
      </nav>
      <div class="header-actions">
        <button id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
    <div class="wrap search-row">
      <input type="search" id="search-input" placeholder="Search…" aria-label="Search the site" />
      <div id="search-results"></div>
    </div>
  </header>

  <main class="wrap main-content prose">
    {{ content }}
  </main>

  <footer class="site-footer wrap">
    <small>© {{ site.title }} · {{ "now" | date: "%Y" }} · Built with <a href="https://jekyllrb.com/">Jekyll</a></small>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var toggle = document.getElementById('theme-toggle');
      if (toggle) {
        toggle.addEventListener('click', function () {
          var root = document.documentElement;
          var dark = root.getAttribute('data-theme') === 'dark';
          if (dark) {
            root.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
          } else {
            root.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
          }
        });
      }

      if (document.getElementById('search-input') && window.simpleJekyllSearch) {
        simpleJekyllSearch({
          searchInput: document.getElementById('search-input'),
          resultsContainer: document.getElementById('search-results'),
          json: '{{ "/search.json" | relative_url }}',
          searchResultTemplate: '<article class="search-item"><a href="{url}"><h4>{title}</h4></a><p>{summary}</p></article>',
          noResultsText: '<p class="search-item">No results</p>',
          limit: 10,
          fuzzy: false
        });
      }
    });
  </script>
</body>
</html>
