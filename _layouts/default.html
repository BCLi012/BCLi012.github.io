<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | default: site.description }}" />
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}" />
  <script src="https://unpkg.com/simple-jekyll-search@latest/distr/simple-jekyll-search.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/projects/' | relative_url }}">Projects</a>
        <a href="{{ '/research/' | relative_url }}">Research</a>
        <a href="{{ '/creative/' | relative_url }}">Creative</a>
        <a href="{{ '/sports/' | relative_url }}">Sports</a>
        <a href="{{ '/thoughts/' | relative_url }}">Thoughts</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
        {% if page.url contains '/zh/' %}
          <a class="lang-switch" href="{{ page.url | replace:'/zh','' }}">EN</a>
        {% else %}
          <a class="lang-switch" href="/zh{{ page.url }}">中文</a>
        {% endif %}
      </nav>
    </div>
    <div class="search-row wrap">
      <input type="search" id="search-input" placeholder="Search...">
      <div id="search-results"></div>
    </div>
  </header>

  <main class="wrap main-content">
    {{ content }}
  </main>

  <footer class="site-footer wrap">
    <small>© {{ site.title }} · {{ "now" | date: "%Y" }}</small>
  </footer>

  <script>
  // simple-jekyll-search init
  document.addEventListener("DOMContentLoaded", function() {
    if (!document.getElementById('search-input')) return;
    simpleJekyllSearch({
      searchInput: document.getElementById('search-input'),
      resultsContainer: document.getElementById('search-results'),
      json: '{{ "/search.json" | relative_url }}',
      searchResultTemplate: '<article class="search-item"><a href="{url}"><h4>{title}</h4></a><p>{summary}</p></article>',
      noResultsText: 'No results',
      limit: 10,
      fuzzy: false
    });
  });
  </script>
</body>
</html>
